name: APK oluştur

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Projeyi aç (en son yüklenen zip)
        run: |
          ZIP=$(git -c core.quotepath=off log -1 --name-only --pretty=format: -- '*.zip' | grep -v '^$' | head -1)
          echo "Derlenen dosya: $ZIP"
          unzip -o "$ZIP" -d build-src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: APK derle
        working-directory: build-src/android-project
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK dosyasını hazırla
        run: cp build-src/android-project/app/build/outputs/apk/release/app-release.apk OnlineAVM.apk

      - name: Releases bölümüne koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Online AVM v${{ github.run_number }}
          files: OnlineAVM.apk
          make_latest: true
